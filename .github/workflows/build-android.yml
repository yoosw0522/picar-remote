name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PiCar-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PiCar-Remote-apk
          path: PiCar-Remote.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PiCar Remote build ${{ github.run_number }}
          body: |
            갤럭시에서 아래 **PiCar-Remote.apk** 를 받아 설치하세요.
            (설치 시 "알 수 없는 앱 허용"을 켜야 할 수 있습니다)
          files: PiCar-Remote.apk
